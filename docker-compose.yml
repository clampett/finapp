services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - finapp-network

  backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - PYTHON_SERVICE_URL=http://python-backend:5000
      # This allows the Docker backend to find the Docker database
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/finapp}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
    depends_on:
      - db
    networks:
      - finapp-network

  python-backend:
    build:
      context: ./python-backend
    ports:
      - "5000:5000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    networks:
      - finapp-network

  db:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=finapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finapp-network

volumes:
  postgres_data:
    external: true
    name: ${FINAPP_POSTGRES_VOLUME:-finapp_postgres_data}

networks:
  finapp-network:
    driver: bridge
