<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinApp - Create Account</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="icon" type="image/svg+xml" href="/static/logo_green.svg" sizes="any">
</head>
<body class="bg-background text-text_color min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-card rounded-xl shadow-lg p-8">
    <!-- Logo at the top left -->
    <div class="flex justify-between items-center max-w-7xl mx-auto">
      <a href="index.html" class="flex items-center group shrink-0">
        <div class="w-8 h-8 rounded-full bg-teal-400 mr-3 group-hover:bg-teal-300 transition-colors"></div>
        <h1 class="text-2xl font-bold tracking-wide">FinApp</h1>
      </a>
    </div>

    <h1 class="text-3xl font-bold mb-6 text-center">Create Account</h1>
    
    <form id="registration-form" class="space-y-6">
      <div>
        <label for="name" class="block text-sm font-medium mb-2">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name"
          required
          class="w-full px-4 py-3 bg-background border border-border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-colors"
          placeholder="Enter your full name"
        >
      </div>

      <div>
        <label for="email" class="block text-sm font-medium mb-2">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          required
          class="w-full px-4 py-3 bg-background border border-border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-colors"
          placeholder="Enter your email"
        >
      </div>

      <div>
        <label for="username" class="block text-sm font-medium mb-2">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username"
          required
          class="w-full px-4 py-3 bg-background border border-border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-colors"
          placeholder="Choose a username"
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-2">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          required
          class="w-full px-4 py-3 bg-background border border-border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-colors"
          placeholder="Create a password"
        >
      </div>

      <div>
        <label for="confirm-password" class="block text-sm font-medium mb-2">Confirm Password</label>
        <input 
          type="password" 
          id="confirm-password" 
          name="confirm-password"
          required
          class="w-full px-4 py-3 bg-background border border-border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-colors"
          placeholder="Confirm your password"
        >
      </div>

      <button 
        type="submit" 
        class="w-full px-4 py-3 bg-primary text-primary-foreground rounded-lg font-medium hover:bg-primary/90 transition-colors"
      >
        Create Account
      </button>
    </form>

    <div class="mt-6 text-center">
      <p class="text-sm mb-4">Already have an account?</p>
      <a 
        href="login.html" 
        class="px-4 py-2 bg-secondary text-secondary-foreground rounded-lg font-medium hover:bg-secondary/90 transition-colors inline-block"
      >
        Sign In
      </a>
    </div>
  </div>

  <script src="/assets/login.js" defer></script>
</body>
</html>
