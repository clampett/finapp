services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - finapp-network

  backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # This allows the Docker backend to find the Docker database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/finapp
    depends_on:
      - db
    networks:
      - finapp-network

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=finapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - finapp-network

volumes:
  postgres_data:

networks:
  finapp-network:
    driver: bridge