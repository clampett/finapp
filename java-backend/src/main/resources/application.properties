server.port=8081
server.tomcat.max-http-post-size=10MB
server.tomcat.max-swallow-size=10MB

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/finapp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# 'validate' ensures your Java Entities match Flyway's SQL tables perfectly
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.clean-disabled=true

#Brevo Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=your_brevo_account_email@example.com
spring.mail.password=your_brevo_smtp_key
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Keep idle shared databases inexpensive and tolerate serverless cold starts.
spring.datasource.hikari.maximum-pool-size=${FINAPP_DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000

# Google OAuth Configuration
google.client.id=${VITE_GOOGLE_CLIENT_ID:838068048970-o4p78cvfjtc2uqm6aicjnqtmout2brtm.apps.googleusercontent.com}