<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/finapp-circle.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <meta name="theme-color" content="#0c1018" />
    <script>
      // Restored the shared preference before the dashboard stylesheet was painted.
      try {
        const saved = localStorage.getItem('user-theme');
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
