# Shared PostgreSQL lives outside Docker; compose down -v cannot remove it.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - finapp-network
  backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Configure the shared JDBC URL in .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Configure the shared database username in .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Configure the shared database password in .env}
      PYTHON_SERVICE_URL: http://python-backend:5000
    depends_on:
      - python-backend
    networks:
      - finapp-network
  python-backend:
    build:
      context: ./python-backend
    ports:
      - "5000:5000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      - finapp-network
networks:
  finapp-network:
    driver: bridge
