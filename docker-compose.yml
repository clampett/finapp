services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - finapp-network

  backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - finapp-network

volumes:
  postgres_data:

networks:
  finapp-network:
    driver: bridge