<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/finapp-circle.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <meta name="theme-color" content="#0c1018" />
    <script>
      // Restored the shared preference before the dashboard stylesheet was painted.
      try {
        const saved = localStorage.getItem('user-theme');
        const isSysLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        const theme = saved === 'light' || saved === 'dark' ? saved : (isSysLight ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f4f7' : '#0c1018');
      } catch {
        const isSysLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        const theme = isSysLight ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
