
name: "CodeQL"
 
on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]           # scans any PR that targets dev, on every push to the PR
  schedule:
    - cron: "30 4 * * 1"          # weekly scan, Mondays 04:30 UTC (optional; delete if unwanted)
 
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write      # required to upload results
      packages: read
      actions: read
      contents: read
 
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript   # covers both JavaScript and TypeScript
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: none                  # switch to autobuild if you want a compiled analysis
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
 
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
