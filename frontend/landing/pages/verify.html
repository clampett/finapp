<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinApp - Verify Your Email</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="icon" type="image/svg+xml" href="/static/logo_green.svg" sizes="any">
</head>
<body class="bg-background text-text_color min-h-screen flex items-center justify-center p-6">

  <div class="bg-card border border-border rounded-2xl shadow-xl w-full max-w-md p-8 text-center">
    <div class="w-12 h-12 rounded-full bg-teal-400 mx-auto mb-4 flex items-center justify-center text-background font-bold text-xl">✓</div>
    <h1 class="text-2xl font-bold mb-2">Check Your Terminal/Email</h1>
    <p class="text-sm text-foreground mb-6">We've sent a 6-digit verification code to your email. Enter it below to activate your account.</p>

    <form id="verify-form" class="space-y-6">
      <!-- 6-Digit Code Input Fields -->
      <div class="flex justify-between gap-2 max-w-xs mx-auto">
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold bg-background border border-border rounded-lg focus:border-primary focus:outline-none" required />
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold bg-background border border-border rounded-lg focus:border-primary focus:outline-none" required />
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold bg-background border border-border rounded-lg focus:border-primary focus:outline-none" required />
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold bg-background border border-border rounded-lg focus:border-primary focus:outline-none" required />
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold bg-background border border-border rounded-lg focus:border-primary focus:outline-none" required />
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold bg-background border border-border rounded-lg focus:border-primary focus:outline-none" required />
      </div>

      <p id="verify-error" class="text-red-400 text-sm h-5"></p>

      <button type="submit" id="verify_button" class="w-full py-3 bg-primary text-white rounded-lg font-medium hover:bg-primary/90 transition-colors cursor-pointer">
        Verify Account
      </button>
    </form>

    <div class="mt-6 text-sm">
      <a href="login.html" class="text-primary hover:underline">Back to Login</a>
    </div>
  </div>

  <script src="/assets/verify.js" type="module"></script>
</body>
</html>
