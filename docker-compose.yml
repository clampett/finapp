services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - FINAPP_API_UPSTREAM=http://backend:8081
    depends_on:
      - backend
    networks:
      - finapp-network

  backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - FINAPP_MAIL_MODE=console
      - FINAPP_SESSION_SECURE=false
      - PYTHON_SERVICE_URL=http://python-backend:5000
      # This allows the Docker backend to find the Docker database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/finapp
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - db
    networks:
      - finapp-network

  python-backend:
    build:
      context: ./python-backend
    ports:
      - "5000:5000"
    environment:
      - PRICE_CACHE_DB=/data/price_cache.db
    volumes:
      - market_cache:/data
    networks:
      - finapp-network

  # Isolated the optional CPU runtime from the normal database and frontend profile.
  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["local-ai"]
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama

  db:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=finapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finapp-network

volumes:
  ollama_models:
  market_cache:
  postgres_data:
    external: true
    name: ${FINAPP_POSTGRES_VOLUME:-finapp_postgres_data}

networks:
  finapp-network:
    driver: bridge
